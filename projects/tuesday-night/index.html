:root{--ui:"Bricolage Grotesque",system-ui,sans-serif;--voice:"Source Serif 4",Georgia,serif}
body{margin:0;font-family:var(--ui);font-size:17px;line-height:1.5;background:var(--bg);color:var(--fg);transition:background-color .8s ease,color .8s ease;min-height:100vh}
body[data-theme=night]{--bg:#1C1B3A;--fg:#ECE9F6;--muted:#A9A6C9;--accent:#FFD98A;--on-accent:#1C1B3A;--surface:#26254A;--line:#3A3966;--good:#8FD6B4;--mid:#FFD98A;--low:#F4A99A}
body[data-theme=morning]{--bg:#E7EEF2;--fg:#1F2433;--muted:#4F5871;--accent:#2B44C8;--on-accent:#fff;--surface:#F7FAFB;--line:#C6D3DB;--good:#1D7A52;--mid:#9A6A00;--low:#B23A2A}
body[data-theme=afternoon]{--bg:#EAF0E3;--fg:#1F2433;--muted:#4F5871;--accent:#2B44C8;--on-accent:#fff;--surface:#F8FAF5;--line:#CBD8C2;--good:#1D7A52;--mid:#8F6200;--low:#B23A2A}
body[data-theme=overcast]{--bg:#DADDE3;--fg:#1F2433;--muted:#4F5871;--accent:#2B44C8;--on-accent:#fff;--surface:#ECEEF2;--line:#BFC4CE;--good:#1D7A52;--mid:#7E5700;--low:#A3321F}
body[data-theme=paper]{--bg:#F3F4F6;--fg:#1F2433;--muted:#4F5871;--accent:#2B44C8;--on-accent:#fff;--surface:#fff;--line:#D5D9E0;--good:#1D7A52;--mid:#8F6200;--low:#B23A2A}
*{box-sizing:border-box}
.wrap{max-width:780px;margin:0 auto;padding:26px 24px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:15px;color:var(--muted);margin-bottom:40px}
.org{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:700}
.org svg{width:28px;height:28px}
.org svg .tree{fill:var(--bg)}
.org svg .disc{fill:var(--fg)}
.where{font-weight:500}

/* the clock: the one loud thing */
.clock{display:flex;align-items:baseline;gap:14px;line-height:.82;margin:0 0 6px}
.clock .t{font-weight:800;font-size:clamp(96px,19vw,184px);letter-spacing:-.045em;color:var(--accent)}
body:not([data-theme=night]) .clock .t{color:var(--fg)}
.clock .ap{font-weight:500;font-size:clamp(22px,4vw,34px);color:var(--muted)}
.day{font-size:20px;color:var(--muted);margin-bottom:34px}

h1,h2,h3{font-family:var(--ui);margin:0}
h1{font-size:clamp(40px,7vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:18px}
h2{font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-bottom:16px}
h1:focus,h2:focus,h3:focus{outline:none}
p{margin:0 0 16px;max-width:62ch}
.lede{font-size:20px;line-height:1.5}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;min-height:54px;padding:0 28px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

/* start screen notification */
.notif{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;max-width:430px;margin:8px 0 40px;box-shadow:0 0 0 0 rgba(255,217,138,0)}
.notif.in{animation:drop .7s cubic-bezier(.2,.9,.3,1.2) .5s both, glow 2.4s ease 1.2s 1}
.notif .ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.notif b{display:block;font-size:16px}
.notif span{font-size:15px;color:var(--muted)}
@keyframes drop{from{opacity:0;transform:translateY(-18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,217,138,.45)}100%{box-shadow:0 0 0 24px rgba(255,217,138,0)}}

/* email */
.email{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.email .hd{padding:14px 20px;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.email .hd b{color:var(--fg)}
.email .bd{padding:18px 20px 22px;font-family:var(--voice);font-size:20px;line-height:1.6;white-space:pre-line}

/* spoken lines */
.line-said{margin:0 0 12px;padding-left:20px;border-left:3px solid var(--line)}
.line-said q{font-family:var(--voice);font-size:24px;line-height:1.45;quotes:"\201C" "\201D";display:block}
.line-said .act{font-family:var(--voice);font-style:italic;font-size:19px;color:var(--muted);display:block;margin-bottom:4px}
.line-said cite{font-style:normal;font-size:15px;color:var(--muted);display:block;margin-top:6px}

.mood{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin:10px 0 0}
.mood .bars{display:flex;gap:3px}
.mood .bars i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.mood .bars i.on{background:var(--fg)}

.prompt{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:36px 0 10px}
.opts{border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:36px 1fr;gap:14px;width:100%;text-align:left;font:inherit;font-size:18px;line-height:1.45;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);padding:18px 10px 18px 4px;cursor:pointer;border-radius:0}
.opt .k{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--muted);margin-top:-2px}
.opt:hover:not(:disabled) .k{box-shadow:inset 0 0 0 2px var(--accent);color:var(--fg)}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--surface) 60%,transparent)}
.opt:disabled{cursor:default}
.opt.picked .k{background:var(--accent);color:var(--on-accent);box-shadow:none}
.opt.picked{font-weight:500}
.opt.dim{color:var(--muted)}

.result{margin-top:34px}
.result .when{font-size:15px;color:var(--muted);margin-bottom:10px}
.mentor{margin:22px 0 0;padding:4px 0 4px 20px;border-left:3px solid var(--tone)}
.mentor .verdict{font-weight:700;color:var(--tone);font-size:16px;display:flex;gap:8px;align-items:center}
.mentor p{font-family:var(--voice);font-size:19px;line-height:1.55;margin:6px 0 6px}
.mentor .sig{font-size:14px;color:var(--muted)}
.t-good{--tone:var(--good)} .t-mid{--tone:var(--mid)} .t-low{--tone:var(--low)}

/* ending */
.end-title{font-size:clamp(52px,10vw,96px);font-weight:800;letter-spacing:-.04em;line-height:.95;margin:4px 0 14px}
.end-kind{font-size:17px;font-weight:700;color:var(--tone);margin-bottom:22px}
.story{font-family:var(--voice);font-size:23px;line-height:1.55;max-width:34em;margin-bottom:38px}
.path{list-style:none;margin:0;padding:0}
.path li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:17px}
.path li:last-child{border-bottom:1px solid var(--line)}
.path .w{color:var(--muted);font-size:15px}

/* reflection */
.steps{margin:28px 0 8px}
.step{display:grid;grid-template-columns:190px 1fr;gap:22px;padding:24px 0;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step .word{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.step .sub{font-size:15px;color:var(--muted);margin-top:6px}
.step .verdict{font-weight:700;color:var(--tone);margin-bottom:6px}
.step p{margin:0 0 6px}
.step .best{color:var(--muted)}
.qs{margin:36px 0 0}
.qs h3{font-size:22px;margin-bottom:10px}
.qs ol{margin:0;padding-left:22px;font-family:var(--voice);font-size:19px;line-height:1.6}
.found{margin-top:34px;font-size:17px}
.found .names{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px}
.found .names span{font-weight:700}
.found .names span.no{color:var(--muted);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fresh{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:600px){.org .long{display:none}.where{text-align:right}.step,.path li{grid-template-columns:1fr;gap:6px}.top{margin-bottom:28px}.line-said q{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-theme="night">
<div class="wrap">
  <header class="top">
    <span class="org"><svg viewBox="0 0 32 32" aria-hidden="true"><circle class="disc" cx="16" cy="16" r="16"/><path class="tree" d="M16 6l7 10h-4l5 7H8l5-7H9z"/></svg>Cedar Grove<span class="long">&nbsp;new teacher induction</span></span>
    <span class="where" id="where"></span>
  </header>
  <main id="main"></main>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script>
(function(){
const MOODS=['upset','guarded','open','grateful'];
const SCRIPT={
 d1:{n:1,clock:['9:14','p.m.'],day:'Tuesday night',theme:'night',heading:'An email just came in',
   scene:()=>email('Monica Torres','Jayden\'s project grade','9:14 p.m.','Hi,\n\nJayden worked on his solar system model all weekend and got a 68. He went to bed in tears. The rubric was never sent home, so how was he supposed to know what you wanted?\n\nI\'d like an explanation.\nMonica Torres')+mood(),
   prompt:'It\'s late and you\'re exhausted. What do you do?',
   opts:[
    {t:'Reply tonight. Walk her through the rubric point by point so she can see the grade is fair.', s:'Replied that night with the rubric breakdown', pts:0, mood:-1, path:'tense',
     reply:{kind:'mail',when:'Her reply, Tuesday at 11:02 p.m.',time:'11:02 p.m.',body:'So it\'s Jayden\'s fault for not reading your mind? He\'s 8.\n\nI\'d like to meet in person. I\'ve copied Principal Hayes.'},
     note:'Late-night replies often read as defensive, and a rubric breakdown answers a question she hasn\'t asked yet. Right now she\'s upset that her son cried.'},
    {t:'Wait until morning. Send a short reply that recognizes Jayden\'s effort and asks if you can talk by phone.', s:'Waited, then acknowledged his effort and asked to talk', pts:2, mood:1, path:'warm',
     reply:{kind:'mail',when:'Her reply, Wednesday at 7:48 a.m.',time:'7:48 a.m.',body:'Thank you for getting back to me. I was pretty upset last night.\n\nI can talk today at 3:30.'},
     note:'Pausing gave you a calmer voice, and leading with Jayden\'s effort showed her you heard what she was really upset about.'},
    {t:'Forward it to your principal tonight and ask how you should respond.', s:'Forwarded it to the principal and waited', pts:1, mood:-1, path:'tense',
     reply:{kind:'mail',when:'Her next email, Wednesday at 4:15 p.m.',time:'4:15 p.m.',body:'I emailed you yesterday and haven\'t heard anything back.\n\nI\'ve copied Principal Hayes. I\'d like to meet.'},
     note:'Asking for advice isn\'t wrong, but while you waited, she heard nothing. To a parent, silence feels like being ignored.'}
   ]},
 d2warm:{n:2,clock:['3:30','p.m.'],day:'Wednesday afternoon, on the phone',theme:'afternoon',heading:'The phone call',
   scene:()=>said('I just don\'t understand the 68. He worked on that thing for hours.','Ms. Torres')+mood(),
   prompt:'How do you start the conversation?',
   opts:[
    {t:'Ask what Jayden told her about the project, and listen before you explain anything.', s:'Asked what Jayden said, then listened', pts:2, mood:1,
     reply:{kind:'say',who:'Ms. Torres',body:'He said he didn\'t know the planets needed labels. Honestly, I didn\'t either.'},
     note:'Asking first surfaced the real issue: a missed expectation, not a lack of effort. Now you know exactly what to clarify.'},
    {t:'Pull up the rubric and walk her through each score so she can see where the points went.', s:'Walked her through the rubric', pts:1, mood:0,
     reply:{kind:'say',who:'Ms. Torres',body:'Okay... I see the labels part. I still think he should have known that ahead of time.'},
     note:'Clear and fair, but you explained before you understood her concern. She\'s following along without feeling heard.'},
    {t:'Offer to bump the grade to a B. It isn\'t worth damaging the relationship over one project.', s:'Offered to raise the grade', pts:0, mood:0,
     reply:{kind:'say',who:'Ms. Torres',body:'Oh. Well, okay. So the grade wasn\'t really accurate to begin with?'},
     note:'It ends the call fast, but it suggests the original grade was wrong, and it sets an expectation for every future grade dispute.'}
   ]},
 d2tense:{n:2,clock:['8:00','a.m.'],day:'Thursday morning, in the conference room',theme:'morning',heading:'The meeting',
   scene:()=>said('Thanks for coming in, Ms. Torres. We all want what\'s best for Jayden.','Principal Hayes')+said('Then I\'d like to understand why my son was set up to fail.','Ms. Torres','She hasn\'t taken her coat off.')+mood(),
   prompt:'Principal Hayes looks at you. How do you open?',
   opts:[
    {t:'Acknowledge how hard this was for Jayden, then ask what happened at home that night.', s:'Acknowledged Jayden\'s night, then asked', pts:2, mood:1,
     reply:{kind:'say',who:'Ms. Torres',act:'Her shoulders drop a little.',body:'He kept saying he didn\'t know about the labels. I didn\'t either.'},
     note:'Leading with empathy lowered the temperature, even in a tense room, and asking surfaced the real issue.'},
    {t:'Explain that the rubric has been posted on the class website since September.', s:'Pointed out the rubric was online', pts:0, mood:-1,
     reply:{kind:'say',who:'Ms. Torres',body:'I have three kids and two jobs. I\'m not checking a website every night.'},
     note:'Accurate, but it sounds like blame. In a tense meeting, facts land as defensiveness until people feel heard.'},
    {t:'Let Principal Hayes take the lead, and only jump in if you\'re asked something.', s:'Let the principal lead', pts:1, mood:0,
     reply:{kind:'act',body:'Principal Hayes smooths things over, but Ms. Torres keeps glancing at you, waiting to hear from her son\'s teacher.'},
     note:'Safe, but this is your relationship with the family. Staying quiet can read as not caring, or not being confident.'}
   ]},
 d3:{n:3,heading:'Wrapping up',
   scene:()=>said('So what happens now?','Ms. Torres')+mood(),
   prompt:'How do you wrap up?',
   opts:[
    {t:'Offer a specific plan: Jayden can redo the labels by Friday for partial credit, and you\'ll send a rubric home with every future project.', s:'Offered a specific plan with next steps', pts:2, mood:1,
     reply:{kind:'say',who:'Ms. Torres',body:'That sounds fair. Jayden will be so relieved.'},
     note:'A clear, specific plan fixes this project and prevents the next misunderstanding. That\'s what rebuilds trust.'},
    {t:'Tell her you\'ll keep an eye on things and follow up if anything changes.', s:'Promised to keep an eye on things', pts:1, mood:0,
     reply:{kind:'say',who:'Ms. Torres',body:'Okay. I guess we\'ll see.'},
     note:'Friendly, but vague. She leaves without knowing what will actually be different.'},
    {t:'Explain kindly that the grade has to stand, but you\'re glad you had a chance to talk.', s:'Kept the grade as-is, no next steps', pts:0, mood:-1,
     reply:{kind:'say',who:'Ms. Torres',body:'So nothing changes. Got it.'},
     note:'Consistency matters, but with no path forward, she leaves with the same problem she came in with.'}
   ]}
};
const ENDINGS={
 partners:{tone:'good',kind:'A good ending',title:'Partners',clock:['3:05','p.m.'],day:'Friday afternoon',theme:'afternoon',story:'Jayden turns in his relabeled model that morning, grinning. After school, an email from Ms. Torres: "Thank you for taking the time. He\'s proud of it now."'},
 turned:{tone:'good',kind:'A good ending',title:'Turned it around',clock:['8:45','a.m.'],day:'Thursday morning, in the hallway',theme:'morning',story:'Principal Hayes catches you outside the conference room: "That started rough, and you turned it around." A week later, Ms. Torres signs up to chaperone the field trip.'},
 okay:{tone:'mid',kind:'An okay ending',title:'Okay for now',clock:['7:52','a.m.'],day:'Two weeks later',theme:'overcast',story:'Ms. Torres accepted the outcome, but her emails are short and formal now. The next time something comes up, you\'ll be starting from lower trust.'},
 bad:{tone:'low',kind:'A tough ending',title:'Up the chain',clock:['7:30','a.m.'],day:'Monday morning',theme:'overcast',story:'An email from Principal Hayes is waiting: Ms. Torres has asked to move Jayden to another class. There\'s a new meeting on your calendar, and the assistant principal will be there too.'}
};
const ORD=['First','Second','Third'];
const S={path:null,picks:{},mood:0,found:new Set()};
const main=document.getElementById('main'),live=document.getElementById('live'),where=document.getElementById('where');
const say=t=>{live.textContent='';setTimeout(()=>live.textContent=t,60);};
const theme=t=>document.body.dataset.theme=t;
const clock=(c,day)=>`<div class="clock" aria-hidden="true"><span class="t">${c[0]}</span><span class="ap">${c[1]}</span></div><div class="day">${day}</div>`;
function email(from,subj,time,body){return `<div class="email"><div class="hd"><span><b>${from}</b> &nbsp;${subj}</span><span>${time}</span></div><div class="bd">${body}</div></div>`;}
function said(body,who,act){return `<blockquote class="line-said">${act?`<span class="act">${act}</span>`:''}<q>${body}</q><cite>${who}</cite></blockquote>`;}
function mood(){return `<div class="mood"><span class="bars" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<=S.mood?'on':''}"></i>`).join('')}</span><span>Ms. Torres sounds ${MOODS[S.mood]}</span></div>`;}
function focusTop(){const h=main.querySelector('h1,h2');h&&h.focus({preventScroll:true});window.scrollTo({top:0});}
function reset(){S.path=null;S.picks={};S.mood=0;}

function start(){
 theme('night'); where.textContent='';
 main.innerHTML=`${clock(['9:14','p.m.'],'Tuesday night')}
 <div class="notif in" aria-hidden="true"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="#1C1B3A" stroke-width="2"/><path d="M3.8 6.8L12 13l8.2-6.2" fill="none" stroke="#1C1B3A" stroke-width="2"/></svg></span><span><b>Monica Torres</b><span>Jayden's project grade</span></span></div>
 <h1 tabindex="-1">The Tuesday night email</h1>
 <p class="lede">You're a first-year 3rd grade teacher at Cedar Grove, grading on the couch, when a parent's email lands. Over the next two days, three choices decide how this goes. There are four ways it can end.</p>
 <p class="muted">There's no trick answer here. Every option is something a tired, well-meaning teacher might really do.</p>
 <div class="actions"><button class="btn" id="go">Open the email</button></div>`;
 main.querySelector('#go').onclick=()=>{reset();decide('d1');};
 focusTop();
}

function sceneMeta(key){
 const D=SCRIPT[key];
 if(key==='d3'){return S.path==='warm'?{clock:['3:42','p.m.'],day:'Still on the phone',theme:'afternoon'}:{clock:['8:20','a.m.'],day:'Still in the conference room',theme:'morning'};}
 return D;
}

function decide(key){
 const D=SCRIPT[key],M=sceneMeta(key);
 theme(M.theme); where.textContent=`${ORD[D.n-1]} of three decisions`;
 main.innerHTML=`<div class="fresh">${clock(M.clock,M.day)}
 <h2 tabindex="-1" class="sr">${D.heading}</h2>
 ${D.scene()}
 <h3 class="prompt" id="pr">${D.prompt}</h3>
 <div class="opts" role="group" aria-labelledby="pr">${D.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k" aria-hidden="true">${'ABC'[k]}</span><span>${o.t}</span></button>`).join('')}</div>
 <div id="res"></div></div>`;
 main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(key,+b.dataset.k));
 focusTop();
 say(`${M.day}, ${M.clock.join(' ')}.`);
}

function replyHTML(r){
 if(r.kind==='mail') return `<div class="when">${r.when}</div>`+email('Monica Torres','Re: Jayden\'s project grade',r.time,r.body);
 if(r.kind==='act') return `<blockquote class="line-said"><span class="act" style="font-size:21px;font-style:italic">${r.body}</span></blockquote>`;
 return said(r.body,r.who,r.act);
}

function choose(key,k){
 const D=SCRIPT[key],o=D.opts[k];
 S.picks[D.n===2?'d2':key]={key,k,pts:o.pts};
 if(o.path) S.path=o.path;
 S.mood=Math.max(0,Math.min(3,S.mood+o.mood));
 main.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.classList.add(j===k?'picked':'dim');if(j===k)b.setAttribute('aria-pressed','true');});
 const tone=o.pts===2?'good':o.pts===1?'mid':'low', verdict={good:'Strong move.',mid:'Partly there.',low:'Rethink this one.'}[tone];
 const nextKey=key==='d1'?(S.path==='warm'?'d2warm':'d2tense'):D.n===2?'d3':'end';
 const res=main.querySelector('#res');
 res.innerHTML=`<div class="result fresh">${replyHTML(o.reply)}${mood()}
  <div class="mentor t-${tone}"><div class="verdict">${verdict}</div><p>${o.note}</p><div class="sig">Ms. Okafor, your mentor</div></div>
  <div class="actions"><button class="btn" id="cont">${nextKey==='end'?'See how it ends':'Continue'}</button></div></div>`;
 say(o.reply.body.replace(/\n/g,' ')+` Ms. Torres sounds ${MOODS[S.mood]}. Your mentor says: ${verdict} ${o.note}`);
 res.querySelector('#cont').onclick=()=>nextKey==='end'?ending():decide(nextKey);
 setTimeout(()=>res.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),80);
}

function endingKey(){
 const s2=S.picks.d2.pts,s3=S.picks.d3.pts,t=s2+s3;
 if(t<=1) return 'bad';
 if(S.path==='warm'&&t>=3) return 'partners';
 if(S.path==='tense'&&s2===2&&s3===2) return 'turned';
 return 'okay';
}

function ending(){
 const ek=endingKey(),E=ENDINGS[ek]; S.found.add(ek);
 theme(E.theme); where.textContent='How it ended';
 const times=S.path==='warm'?['Tuesday night','Wednesday, 3:30 p.m.','Wednesday, 3:42 p.m.']:['Tuesday night','Thursday, 8:00 a.m.','Thursday, 8:20 a.m.'];
 const rows=['d1','d2','d3'].map((d,i)=>{const p=S.picks[d];return `<li><span class="w">${times[i]}</span><span>${SCRIPT[p.key].opts[p.k].s}</span></li>`;}).join('');
 main.innerHTML=`<div class="fresh t-${E.tone}">${clock(E.clock,E.day)}
 <h2 tabindex="-1" class="end-title">${E.title}</h2>
 <div class="end-kind">${E.kind}</div>
 <p class="story">${E.story}</p>
 <ol class="path" aria-label="Your choices">${rows}</ol>
 <div class="actions"><button class="btn" id="refl">Reflect on your choices</button></div></div>`;
 main.querySelector('#refl').onclick=reflect;
 focusTop(); say(`${E.kind}: ${E.title}. ${E.story}`);
}

function reflect(){
 theme('paper'); where.textContent='Reflection';
 const rows=[['d1','Listen','Respond to the feeling, not just the facts'],['d2','Clarify','Ask before you explain'],['d3','Plan','Leave with specific next steps']].map(([d,word,sub])=>{
  const p=S.picks[d],D=SCRIPT[p.key],o=D.opts[p.k],best=D.opts.find(x=>x.pts===2),tone=o.pts===2?'good':o.pts===1?'mid':'low';
  return `<div class="step t-${tone}"><div><div class="word">${word}</div><div class="sub">${sub}</div></div><div><div class="verdict">${{good:'Strong move',mid:'Partly there',low:'Missed this one'}[tone]}</div><p>You ${o.s.charAt(0).toLowerCase()+o.s.slice(1)}.</p>${o.pts===2?'':`<p class="best">The strongest move: ${best.s.charAt(0).toLowerCase()+best.s.slice(1)}.</p>`}</div></div>`;}).join('');
 main.innerHTML=`<div class="fresh"><h2 tabindex="-1">Listen, clarify, plan</h2>
 <p class="lede">Hard parent conversations tend to go better when you move through these three in order. Here's how your choices lined up.</p>
 <div class="steps">${rows}</div>
 <div class="qs"><h3>Questions for your next mentor meeting</h3><ol><li>What made the late-night reply tempting?</li><li>Think of a parent conversation that went well. Which of the three steps did you use?</li><li>What's one sentence you'll use the next time a parent is upset?</li></ol></div>
 <div class="actions"><button class="btn" id="again">Play again</button><button class="btn quiet" id="home">Back to the start</button></div></div>`;
 main.querySelector('#again').onclick=()=>{reset();decide('d1');};
 main.querySelector('#home').onclick=start;
 focusTop();
}
start();
})();
</script>
</body>
</html>
