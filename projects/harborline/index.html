:root{
  --sand:#F6F1E7; --sand-2:#EDE5D6; --card:#FFFFFF; --navy:#1B3354; --slate:#5B6B7F;
  --teal:#2E6F6A; --teal-2:#245955; --sea:#A9D3CC; --sea-soft:#DCEEEA;
  --coral:#B54A32; --coral-soft:#FBEAE5; --green:#1E5C3A; --green-soft:#E6F2EC;
  --radius:18px; --shadow:0 10px 30px rgba(27,51,84,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#E9F1EE 0%,#F6F1E7 55%,#F2E7D6 100%);font-family:"DM Sans",system-ui,sans-serif;color:var(--navy);font-size:17px;line-height:1.5;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100vh;max-height:880px;background:var(--sand);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:520px){.app{border-radius:28px;box-shadow:0 24px 60px rgba(27,51,84,.18);height:calc(100vh - 40px)}}
header{padding:16px 22px 0;position:relative;z-index:2}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:500}
.brand .logo{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:700}
.brand .logo svg{width:22px;height:22px}
.progress{margin-top:12px;height:6px;background:var(--sand-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s ease}
.section-label{margin-top:8px;font-size:13px;color:var(--slate);display:flex;justify-content:space-between}
main{flex:1;overflow-y:auto;padding:18px 22px 24px;position:relative;z-index:1}
main:focus{outline:none}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0 0 12px}
h1{font-size:34px}
h2{font-size:27px}
h2:focus{outline:none}
p{margin:0 0 14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.muted{color:var(--slate)}
footer{padding:14px 22px 20px;display:flex;gap:10px;background:var(--sand);border-top:1px solid var(--sand-2);position:relative;z-index:2}
button{font:inherit;cursor:pointer}
.btn{min-height:50px;border-radius:14px;border:0;padding:0 20px;font-weight:700;font-size:17px}
.btn-primary{flex:1;background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-2)}
.btn-primary:disabled{background:#B9C4C2;color:#fff;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--navy);border:2px solid var(--sand-2)}
.btn-ghost[hidden]{display:none}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.waves{position:absolute;left:0;right:0;bottom:78px;height:120px;z-index:0;pointer-events:none;opacity:.55}

/* cards & bits */
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero-art{display:flex;justify-content:center;margin:6px 0 20px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.chip{background:var(--card);border-radius:99px;padding:7px 14px;font-size:15px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.scene{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:16px;position:relative}
.scene .time{font-family:Fraunces,serif;font-size:40px;line-height:1;margin-bottom:6px}
.scene p{margin:0}
.guest{display:flex;gap:12px;align-items:flex-end;margin:14px 0}
.guest svg{flex:0 0 64px}
.bubble{background:var(--card);border-radius:18px 18px 18px 4px;padding:12px 15px;box-shadow:var(--shadow);font-size:16px;position:relative}
.bubble.you{background:var(--sea-soft);border-radius:18px 18px 4px 18px;margin-left:30px}
.bubble small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:2px}

.option{display:block;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;color:var(--navy);box-shadow:var(--shadow);min-height:52px;line-height:1.4}
.option:hover:not(:disabled){border-color:var(--sea)}
.option[aria-pressed="true"]{border-color:var(--teal)}
.option:disabled{cursor:default}
.option.correct{border-color:var(--green);background:var(--green-soft)}
.option.wrong{border-color:var(--coral);background:var(--coral-soft)}
.option .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.option.correct .tag{color:var(--green)}
.option.wrong .tag{color:var(--coral)}

.feedback{border-radius:14px;padding:14px 16px;margin-top:4px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.feedback svg{flex:0 0 22px;margin-top:2px}
.feedback.good{background:var(--green-soft);color:var(--green)}
.feedback.bad{background:var(--coral-soft);color:#8E3A27}
.feedback.info{background:var(--sea-soft);color:var(--navy)}
.feedback b{display:block}

.a-cards{display:grid;gap:12px}
.a-card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);color:var(--navy);min-height:76px}
.a-card .num{flex:0 0 46px;height:46px;border-radius:50%;background:var(--sea-soft);color:var(--teal);font-family:Fraunces,serif;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.a-card.open .num{background:var(--teal);color:#fff}
.a-card strong{display:block;font-size:19px}
.a-card .reveal{font-size:15px;color:var(--slate)}
.a-card .hint{font-size:13px;color:var(--teal);font-weight:700}

.dd{display:grid;gap:10px;margin-top:6px}
.dd div{border-radius:14px;padding:12px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.dd .do{background:var(--green-soft);color:var(--green)}
.dd .dont{background:var(--coral-soft);color:#8E3A27}
.dd b{display:block}
.dd svg{flex:0 0 20px;margin-top:3px}
.tip{border-left:4px solid var(--teal);padding:4px 0 4px 12px;margin-top:16px;font-size:16px}

.slots{display:grid;gap:8px;margin:6px 0 16px}
.slot{border:2px dashed #C9BFAD;border-radius:14px;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--slate);font-size:16px}
.slot.filled{border-style:solid;border-color:var(--teal);background:var(--card);color:var(--navy);font-weight:700}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--sand-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--navy)}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--teal);background:var(--card);color:var(--teal);border-radius:99px;padding:10px 18px;font-weight:700;min-height:46px}
.pill:disabled{opacity:.35;cursor:default}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:700;text-decoration:underline;padding:8px 0;min-height:44px}

.flip{width:100%;border:0;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:left;margin-bottom:12px;color:var(--navy);min-height:84px}
.flip .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.flip .lbl.avoid{color:var(--coral)}
.flip .lbl.say{color:var(--green)}
.flip .line{font-family:Fraunces,serif;font-size:20px}
.flip .cta{font-size:13px;color:var(--teal);font-weight:700;margin-top:4px}
.flip.flipped{background:var(--green-soft)}

.round{font-size:13px;font-weight:700;color:var(--slate);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.step-tabs{display:flex;gap:6px;margin-bottom:12px}
.step-tabs span{flex:1;text-align:center;font-size:13px;font-weight:700;padding:7px 0;border-radius:99px;background:var(--sand-2);color:var(--slate)}
.step-tabs span.on{background:var(--teal);color:#fff}
.step-tabs span.done{background:var(--sea-soft);color:var(--teal)}
.final{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:6px 0 14px}
.final p{margin:0 0 8px;font-size:16px}
.final .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);display:block}

.score{font-family:Fraunces,serif;font-size:64px;line-height:1;margin:6px 0}
.pocket{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px;margin:14px 0}
.pocket h3{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:0 0 10px}
.pocket ol{margin:0 0 12px;padding-left:20px}
.pocket li{margin-bottom:4px}
.pocket .sw{font-size:15px;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}
.pocket .sw div{margin-bottom:4px}
.pocket .sw s{opacity:.7}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2E6F6A"/><path d="M4 14c2.5-2 5.5-2 8 0s5.5 2 8 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 10c2.5-2 5.5-2 8 0s5.5 2 8 0" stroke="#A9D3CC" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Harborline</span>
      <span>Front desk essentials</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Course progress" aria-valuemin="1" aria-valuemax="18" aria-valuenow="1"><span id="bar" style="width:5%"></span></div>
    <div class="section-label"><span id="part">Welcome</span><span id="count">1 of 18</span></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <svg class="waves" viewBox="0 0 430 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 70 C70 40 140 100 215 70 S360 40 430 70 V120 H0Z" fill="#DCEEEA"/>
    <path d="M0 90 C80 65 150 115 230 90 S370 70 430 92 V120 H0Z" fill="#A9D3CC" opacity=".6"/>
  </svg>
  <footer>
    <button class="btn btn-ghost" id="back" hidden>Back</button>
    <button class="btn btn-primary" id="next">Start</button>
  </footer>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>

<script>
(function(){
const ICON = {
  check:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2E6F6A"/><path d="M12 11v6M12 7.5v.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
  clock:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2E6F6A" stroke-width="2"/><path d="M12 7v5l3 2" stroke="#2E6F6A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  mute:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2E6F6A"/><path d="M17 9l4 6M21 9l-4 6" stroke="#2E6F6A" stroke-width="2" stroke-linecap="round"/></svg>',
  phone:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5" fill="none" stroke="#2E6F6A" stroke-width="2"/><circle cx="12" cy="18" r="1.2" fill="#2E6F6A"/></svg>'
};
const GUEST = (mood)=>`<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#EDE5D6"/><path d="M12 60c2-12 10-18 20-18s18 6 20 18" fill="#B54A32"/><circle cx="32" cy="26" r="12" fill="#C99A78"/><path d="M19 25c0-10 6-15 13-15s14 5 13 15c-3-4-7-6-13-6s-10 2-13 6z" fill="#2B2B33"/>${mood==='happy'?'<path d="M27 30c2 2.5 8 2.5 10 0" stroke="#2B2B33" stroke-width="1.8" fill="none" stroke-linecap="round"/>':'<path d="M27 32c2-2 8-2 10 0" stroke="#2B2B33" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M26 22.5l4 1.5M38 22.5l-4 1.5" stroke="#2B2B33" stroke-width="1.6" stroke-linecap="round"/>'}<circle cx="28" cy="26" r="1.3" fill="#2B2B33"/><circle cx="36" cy="26" r="1.3" fill="#2B2B33"/></svg>`;
const BELL = '<svg viewBox="0 0 180 130" width="200" height="144" aria-hidden="true"><ellipse cx="90" cy="118" rx="70" ry="8" fill="#EDE5D6"/><rect x="25" y="100" width="130" height="12" rx="6" fill="#1B3354"/><path d="M40 100a50 50 0 0 1 100 0z" fill="#2E6F6A"/><path d="M58 92a34 34 0 0 1 22-34" stroke="#A9D3CC" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="84" y="40" width="12" height="10" rx="3" fill="#1B3354"/><circle cx="90" cy="34" r="8" fill="#1B3354"/><path d="M150 40l12-8M154 56l14 0M146 24l6-12" stroke="#B54A32" stroke-width="4" stroke-linecap="round"/></svg>';

const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const esc = s => s;

const QUIZ = [
  {q:'A guest is upset. Which order should your first response follow?', opts:[
    {t:'Apologize, Act, Acknowledge', f:'Close, but jumping straight to "sorry" can feel scripted. Show you heard them first.'},
    {t:'Acknowledge, Apologize, Act', ok:true, f:'Exactly. Show you heard them, own the moment, then say what happens next.'},
    {t:'Act, Acknowledge, Apologize', f:'Fixing things fast is great, but guests who don\'t feel heard often stay upset even after the fix.'},
    {t:'Acknowledge, Act, Apologize', f:'An apology that comes last can sound like an afterthought. Apologize before you explain the fix.'}]},
  {q:'"My key card has stopped working three times today!" What\'s the best way to acknowledge?', opts:[
    {t:'"Three times? That\'s really frustrating, especially after a long day."', ok:true, f:'Yes. You repeated the problem and named the feeling. The guest knows you get it.'},
    {t:'"Key cards do that sometimes when they\'re near a phone."', f:'This explains instead of acknowledging. It can sound like you\'re blaming the guest\'s phone.'},
    {t:'"Did you keep it next to your phone?"', f:'Starting with a question about what they did wrong puts the guest on the defensive.'},
    {t:'"Okay, hand it over."', f:'Efficient, but it skips their frustration entirely. Acknowledge first, then fix.'}]},
  {q:'A guest says noisy neighbors kept them up all night. Which apology works best?', opts:[
    {t:'"Sorry, we can\'t really control other guests."', f:'True, but it shuts the conversation down and sounds like an excuse.'},
    {t:'"I apologize on behalf of the hotel for any inconvenience you may have experienced."', f:'This sounds scripted. "Any inconvenience" makes their bad night sound small.'},
    {t:'"I\'m so sorry the noise kept you up. That\'s not the stay you should be having."', ok:true, f:'Yes. It\'s short, sincere, and specific to what happened, with no blame.'},
    {t:'"Sorry, but did you call the front desk last night?"', f:'The "but" cancels the apology and hints that it\'s their fault for not calling.'}]},
  {q:'The AC in a guest\'s room is broken. Which "Act" statement is strongest?', opts:[
    {t:'"I\'ll let someone know."', f:'Too vague. The guest doesn\'t know who, what, or when.'},
    {t:'"Maintenance is really busy today."', f:'This explains why it might be slow, but it doesn\'t promise any action.'},
    {t:'"You can call maintenance at extension 4."', f:'This hands the problem back to the guest. You own it now.'},
    {t:'"I\'ll have maintenance there within 15 minutes. If it\'s not fixed by then, I\'ll move you to a new room."', ok:true, f:'Yes. It says exactly what will happen and when, with a backup plan.'}]},
  {q:'A guest is raising their voice about a parking charge. What\'s most likely to calm things down?', opts:[
    {t:'"Please calm down so I can help you."', f:'"Calm down" almost always does the opposite. It tells the guest their feelings are the problem.'},
    {t:'"I can see that charge surprised you. Let\'s look at it together."', ok:true, f:'Yes. You acknowledged the feeling and turned it into teamwork.'},
    {t:'"Parking is $25 a night. That\'s our policy."', f:'"That\'s our policy" sounds like a wall. Try "Here\'s what I can do" instead.'},
    {t:'"You\'ll have to talk to my manager about that."', f:'Passing it off right away sounds like "not my problem." Try to help first.'}]}
];

const BUILD = [
  {step:'Acknowledge', opts:[
    {t:'"Rooms aren\'t guaranteed until 4 on busy days."', f:'That\'s an explanation, and it sounds like you\'re defending the hotel. Acknowledge her feelings first.'},
    {t:'"You\'ve been waiting since 3, after a long flight. That\'s really frustrating."', ok:true, f:'Yes. You named the problem and the feeling.'}]},
  {step:'Apologize', opts:[
    {t:'"I\'m sorry you\'ve had to wait."', ok:true, f:'Short, sincere, no blame. Perfect.'},
    {t:'"Sorry, housekeeping is short-staffed today."', f:'This blames a coworker. Guests just hear an excuse.'}]},
  {step:'Act', opts:[
    {t:'"It shouldn\'t be much longer."', f:'Too vague. She still doesn\'t know when, or what you\'re doing about it.'},
    {t:'"I\'ll have a room ready in 15 minutes. Can I store your bags and get you a drink while you wait?"', ok:true, f:'Specific, with a time and a small kindness. That\'s the move.'}]}
];

const SWAPS = [
  {guest:'"I\'ve been on hold with you people for ten minutes!"', opts:[
    {t:'"Please calm down, sir."', f:'"Calm down" tells him his feelings are the problem. It usually makes things worse.'},
    {t:'"Ten minutes on hold is way too long. I\'m sorry. Let\'s fix this now."', ok:true, f:'Nice. You acknowledged, apologized, and moved to action, all in one breath.'}]},
  {guest:'"The restaurant charged me twice for breakfast."', opts:[
    {t:'"Let me call the restaurant manager and get that sorted for you."', ok:true, f:'Yes. You took ownership even though it\'s not your area.'},
    {t:'"That\'s not my department. You\'ll need to ask the restaurant."', f:'Technically true, but now she has to start over somewhere else. Own it.'}]},
  {guest:'"Why can\'t I check out at 2? It\'s just a few hours!"', opts:[
    {t:'"Sorry, that\'s our policy."', f:'"Policy" sounds like a wall. Offer what you can do instead.'},
    {t:'"Here\'s what I can do: 1 p.m. is free, or 2 p.m. for a small fee."', ok:true, f:'Great. You held the line on policy while still giving him options.'}]}
];

const S = { i:0, done:{}, hook:null, reveal:[false,false,false], seq:[], seqPool:shuffle(['Acknowledge','Apologize','Act']), flips:[false,false,false], swap:{r:0,pick:null,results:[]}, build:{s:0,picks:[null,null,null],wrong:null}, quiz:[] };

const PARTS = (i)=> i<1?'Welcome': i<3?'The situation': i<7?'Learn': i<11?'Practice': i<17?'Knowledge check':'Results';

const screens = [
  // 0 welcome
  {next:'Start', render:()=>`
    <div class="hero-art">${BELL}</div>
    <div class="eyebrow">Front desk essentials</div>
    <h1 tabindex="-1">Turning a complaint around</h1>
    <p class="muted">The first 60 seconds with an upset guest set the tone for everything after. Here's what to say.</p>
    <div class="meta"><span class="chip">${ICON.clock} 10 minutes</span><span class="chip">${ICON.mute} No sound needed</span><span class="chip">${ICON.phone} Made for your phone</span></div>`},
  // 1 meet Ms Rivera
  {render:()=>`
    <div class="eyebrow">Meet your guest</div>
    <h2 tabindex="-1">Ms. Rivera has had a long day</h2>
    <div class="scene"><div class="time">3:40 p.m.</div><p>Check-in was at 3:00. Her room still isn't ready, and she just got off a five-hour flight.</p></div>
    <div class="guest">${GUEST()}<div class="bubble"><small>Ms. Rivera</small>"I've been standing here forever. Is my room ready or not?"</div></div>`},
  // 2 hook choice
  {gate:()=>S.hook!==null, render:()=>{
    const o=['"Housekeeping is running behind today."','"I\'m so sorry! Let me check."','"You\'ve been waiting since 3, after a long flight. That\'s frustrating."'];
    return `<div class="eyebrow">Your first move</div>
    <h2 tabindex="-1">What do you say first?</h2>
    <p class="muted">Go with your gut. There's no score here.</p>
    ${o.map((t,k)=>`<button class="option" data-hook="${k}" aria-pressed="${S.hook===k}">${t}</button>`).join('')}
    ${S.hook!==null?`<div class="feedback info fade">${ICON.info}<span><b>Hold that thought.</b>We'll come back to Ms. Rivera at the end and see if you'd change your answer.</span></div>`:''}`;}},
  // 3 the 3 A's
  {gate:()=>S.reveal.every(Boolean), render:()=>{
    const A=[['Acknowledge','Show them you heard the problem and the feeling.'],['Apologize','Say sorry for the experience. Short, sincere, no blame.'],['Act','Tell them exactly what you\'ll do, and when.']];
    return `<div class="eyebrow">The model</div>
    <h2 tabindex="-1">The 3 A's</h2>
    <p class="muted">Every great first response hits these three, in order. Tap each one.</p>
    <div class="a-cards">${A.map((a,k)=>`<button class="a-card ${S.reveal[k]?'open':''}" data-reveal="${k}" aria-expanded="${S.reveal[k]}"><span class="num">${k+1}</span><span><strong>${a[0]}</strong>${S.reveal[k]?`<span class="reveal">${a[1]}</span>`:'<span class="hint">Tap to reveal</span>'}</span></button>`).join('')}</div>`;}},
  // 4 acknowledge
  {render:()=>`
    <div class="eyebrow">A #1</div>
    <h2 tabindex="-1">Acknowledge</h2>
    <p>Repeat the problem and name the feeling. It tells the guest, "I get it."</p>
    <div class="bubble you"><small>You</small>"Your room isn't ready, and you've been waiting since 3. That's really frustrating."</div>
    <div class="tip"><b>Tip:</b> Don't explain yet. Explanations sound like excuses before a guest feels heard.</div>`},
  // 5 apologize
  {render:()=>`
    <div class="eyebrow">A #2</div>
    <h2 tabindex="-1">Apologize</h2>
    <p>Keep it short and sincere. Apologize for their experience, not for a coworker.</p>
    <div class="dd"><div class="do">${ICON.check}<span><b>Say</b>"I'm sorry you've had to wait."</span></div><div class="dont">${ICON.x}<span><b>Avoid</b>"Sorry, housekeeping is slow today."</span></div></div>`},
  // 6 act
  {render:()=>`
    <div class="eyebrow">A #3</div>
    <h2 tabindex="-1">Act</h2>
    <p>Say what you'll do and when. Specific beats vague every time.</p>
    <div class="dd"><div class="do">${ICON.check}<span><b>Say</b>"Your room will be ready in 15 minutes. Can I get you a drink while you wait?"</span></div><div class="dont">${ICON.x}<span><b>Avoid</b>"It should be ready soon."</span></div></div>`},
  // 7 sequence
  {gate:()=>S.done.seq, render:()=>{
    const full=S.seq.length===3, right=full && S.seq.join()==='Acknowledge,Apologize,Act';
    return `<div class="eyebrow">Quick check</div>
    <h2 tabindex="-1">Put them in order</h2>
    <p class="muted">Tap the 3 A's in the order you'd use them.</p>
    <div class="slots">${[0,1,2].map(k=>`<div class="slot ${S.seq[k]?'filled':''}"><span class="n">${k+1}</span>${S.seq[k]||'Tap a step below'}</div>`).join('')}</div>
    <div class="pool">${S.seqPool.map(t=>`<button class="pill" data-seq="${t}" ${S.seq.includes(t)||full?'disabled':''}>${t}</button>`).join('')}</div>
    ${full?(right?`<div class="feedback good fade" style="margin-top:16px">${ICON.check}<span><b>That's it.</b>Heard, sorry, solved.</span></div>`:`<div class="feedback bad fade" style="margin-top:16px">${ICON.x}<span><b>Not quite.</b>Guests need to feel heard first, so Acknowledge leads. Then Apologize, then Act.</span></div><button class="linkbtn" data-seqreset>Try again</button>`):''}`;}},
  // 8 phrases that make it worse
  {gate:()=>S.flips.every(Boolean), render:()=>{
    const P=[['"Calm down."','"I can see this is frustrating."'],['"That\'s not my department."','"Let me get the right person for you."'],['"That\'s our policy."','"Here\'s what I can do."']];
    return `<div class="eyebrow">Watch your words</div>
    <h2 tabindex="-1">3 phrases that make it worse</h2>
    <p class="muted">Tap each card to see what to say instead.</p>
    ${P.map((p,k)=>`<button class="flip ${S.flips[k]?'flipped':''}" data-flip="${k}" aria-label="${S.flips[k]?'Instead, say '+p[1]:'Avoid saying '+p[0]+'. Tap to see what to say instead.'}">${S.flips[k]?`<span class="lbl say">${ICON.check} Say instead</span><span class="line">${p[1]}</span>`:`<span class="lbl avoid">${ICON.x} Avoid</span><span class="line">${p[0]}</span><span class="cta">Tap to swap</span>`}</button>`).join('')}`;}},
  // 9 swap practice
  {gate:()=>S.swap.results.length===3, render:()=>{
    const r=Math.min(S.swap.r,2), R=SWAPS[r], picked=S.swap.pick;
    return `<div class="eyebrow">Practice</div>
    <h2 tabindex="-1">Pick the better line</h2>
    <div class="round">Round ${r+1} of 3</div>
    <div class="guest">${GUEST()}<div class="bubble"><small>Guest</small>${R.guest}</div></div>
    ${R.opts.map((o,k)=>{const cls=picked===null?'':(o.ok?'correct':(picked===k?'wrong':''));return `<button class="option ${cls}" data-swap="${k}" ${picked!==null?'disabled':''}>${cls?`<span class="tag">${o.ok?'Better':'Avoid'}</span><br>`:''}${o.t}</button>`;}).join('')}
    ${picked!==null?`<div class="feedback ${R.opts[picked].ok?'good':'bad'} fade">${R.opts[picked].ok?ICON.check:ICON.x}<span>${R.opts[picked].f}</span></div>${S.swap.results.length<3?`<button class="linkbtn" data-swapnext>Next round</button>`:''}`:''}`;}},
  // 10 build response
  {gate:()=>S.done.build, render:()=>{
    const B=S.build;
    if(B.s>2){
      return `<div class="eyebrow">Back to Ms. Rivera</div>
      <h2 tabindex="-1">Your response</h2>
      <div class="final fade">${BUILD.map((b,k)=>`<p><span class="k">${b.step}</span>${b.opts.find(o=>o.ok).t}</p>`).join('')}</div>
      <div class="guest">${GUEST('happy')}<div class="bubble"><small>Ms. Rivera</small>"Okay. Thank you. A drink sounds great."</div></div>
      <div class="feedback good">${ICON.check}<span><b>Turned around.</b>Same problem, same wait, completely different guest. Compare that with your first instinct back at the start.</span></div>`;
    }
    const st=BUILD[B.s];
    return `<div class="eyebrow">Back to Ms. Rivera</div>
    <h2 tabindex="-1">Build your response</h2>
    <div class="step-tabs">${BUILD.map((b,k)=>`<span class="${k===B.s?'on':(k<B.s?'done':'')}">${b.step}</span>`).join('')}</div>
    <p class="muted">Choose the best line for <b>${st.step}</b>.</p>
    ${st.opts.map((o,k)=>`<button class="option ${B.wrong===k?'wrong':''}" data-build="${k}" ${B.wrong===k?'disabled':''}>${B.wrong===k?'<span class="tag">Try the other one</span><br>':''}${o.t}</button>`).join('')}
    ${B.wrong!==null?`<div class="feedback bad fade">${ICON.x}<span>${st.opts[B.wrong].f}</span></div>`:''}`;}},
  // 11 quiz intro
  {next:'Start the check', render:()=>`
    <div class="eyebrow">Knowledge check</div>
    <h2 tabindex="-1">Let's see what stuck</h2>
    <p>5 quick questions based on real front desk moments. Get 4 right to pass.</p>
    <div class="card"><p style="margin:0">You'll get feedback after every answer, so you'll learn something either way.</p></div>`},
  ...QUIZ.map((Q,qi)=>({gate:()=>S.quiz[qi]!==undefined, render:()=>{
    const pick=S.quiz[qi];
    return `<div class="eyebrow">Question ${qi+1} of 5</div>
    <h2 tabindex="-1" style="font-size:23px">${Q.q}</h2>
    ${Q.opts.map((o,k)=>{const cls=pick===undefined?'':(o.ok?'correct':(pick===k?'wrong':''));return `<button class="option ${cls}" data-quiz="${qi}:${k}" ${pick!==undefined?'disabled':''}>${cls?`<span class="tag">${o.ok?'Best answer':'Your answer'}</span><br>`:''}${o.t}</button>`;}).join('')}
    ${pick!==undefined?`<div class="feedback ${Q.opts[pick].ok?'good':'bad'} fade">${Q.opts[pick].ok?ICON.check:ICON.x}<span><b>${Q.opts[pick].ok?'Correct.':'Not the best choice.'}</b>${Q.opts[pick].f}</span></div>`:''}`;}})),
  // 17 results
  {next:'Finish', render:()=>{
    const score=S.quiz.filter((p,qi)=>QUIZ[qi].opts[p]&&QUIZ[qi].opts[p].ok).length, pass=score>=4;
    if(pass) markComplete(score);
    return `<div class="eyebrow">${pass?'You passed':'Almost there'}</div>
    <div class="score">${score}/5</div>
    <h2 tabindex="-1">${pass?'You\'re ready for the desk.':'Let\'s try that again.'}</h2>
    <p class="muted">${pass?'Keep this pocket card handy for your first few shifts.':'You need 4 of 5 to pass. Review the pocket card, then retake the check.'}</p>
    <div class="pocket"><h3>Pocket card: the first 60 seconds</h3>
      <ol><li><b>Acknowledge</b> the problem and the feeling</li><li><b>Apologize</b> briefly, with no blame</li><li><b>Act:</b> say what you'll do, and when</li></ol>
      <div class="sw"><div><s>Calm down</s> → I can see this is frustrating.</div><div><s>Not my department</s> → Let me get the right person.</div><div><s>That's our policy</s> → Here's what I can do.</div></div></div>
    ${pass?'':'<button class="btn btn-ghost" data-retry style="width:100%">Retake the check</button>'}`;}}
];

let completed=false;
function markComplete(score){
  if(completed) return; completed=true;
  // Hook for an LMS wrapper or Rise code block completion
  try{ window.parent && window.parent.postMessage({type:'harborline-complete',score},'*'); }catch(e){}
}

const main=document.getElementById('main'), next=document.getElementById('next'), back=document.getElementById('back'), live=document.getElementById('live');
function say(t){ live.textContent=''; setTimeout(()=>live.textContent=t,50); }

function render(focus){
  const sc=screens[S.i];
  main.innerHTML=`<div class="fade">${sc.render()}</div>`;
  main.scrollTop=0;
  const n=S.i+1;
  document.getElementById('bar').style.width=(n/18*100)+'%';
  document.querySelector('.progress').setAttribute('aria-valuenow',n);
  document.getElementById('count').textContent=n+' of 18';
  document.getElementById('part').textContent=PARTS(S.i);
  back.hidden=S.i===0||S.i>=12;
  next.textContent=sc.next||'Next';
  next.disabled=sc.gate?!sc.gate():false;
  if(S.i===17){ next.hidden = !(S.quiz.filter((p,qi)=>QUIZ[qi].opts[p].ok).length>=4); } else next.hidden=false;
  if(focus){ const h=main.querySelector('h1,h2'); h&&h.focus(); }
}
function rerender(sel){ render(false); if(sel){ const el=main.querySelector(sel); el&&el.focus(); } }

main.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.hook!==undefined){ S.hook=+d.hook; rerender(`[data-hook="${d.hook}"]`); say('Hold that thought. We\'ll come back to Ms. Rivera at the end.'); }
  else if(d.reveal!==undefined){ S.reveal[+d.reveal]=true; rerender(`[data-reveal="${d.reveal}"]`); say(b.querySelector('strong').textContent+' revealed.'); }
  else if(d.seq!==undefined){ S.seq.push(d.seq); if(S.seq.length===3){ const ok=S.seq.join()==='Acknowledge,Apologize,Act'; if(ok)S.done.seq=true; rerender(ok?null:'[data-seqreset]'); say(ok?'Correct. Acknowledge, Apologize, Act.':'Not quite. Acknowledge comes first, then Apologize, then Act.'); } else { rerender('[data-seq]:not([disabled])'); } }
  else if(d.seqreset!==undefined){ S.seq=[]; S.seqPool=shuffle(S.seqPool); rerender('[data-seq]'); }
  else if(d.flip!==undefined){ S.flips[+d.flip]=true; rerender(`[data-flip="${d.flip}"]`); say('Say instead: '+b.textContent); }
  else if(d.swap!==undefined){ const k=+d.swap, R=SWAPS[S.swap.r]; S.swap.pick=k; S.swap.results.push(!!R.opts[k].ok); rerender(S.swap.results.length<3?'[data-swapnext]':null); say(R.opts[k].f); }
  else if(d.swapnext!==undefined){ S.swap.r++; S.swap.pick=null; rerender('[data-swap]'); }
  else if(d.build!==undefined){ const k=+d.build, st=BUILD[S.build.s]; if(st.opts[k].ok){ say(st.opts[k].f); S.build.picks[S.build.s]=k; S.build.s++; S.build.wrong=null; if(S.build.s>2) S.done.build=true; rerender('[data-build]'); } else { S.build.wrong=k; say(st.opts[k].f); rerender('[data-build]:not([disabled])'); } }
  else if(d.quiz!==undefined){ const [qi,k]=d.quiz.split(':').map(Number); S.quiz[qi]=k; const o=QUIZ[qi].opts[k]; say((o.ok?'Correct. ':'Not the best choice. ')+o.f); rerender(null); next.focus(); }
  else if(d.retry!==undefined){ S.quiz=[]; S.i=11; render(true); }
});
next.addEventListener('click',()=>{ if(S.i===17){ main.innerHTML='<div class="fade" style="text-align:center;padding-top:40px"><div class="hero-art">'+BELL+'</div><h2 tabindex="-1">Nice work.</h2><p class="muted">You can close this module now.</p></div>'; next.hidden=true; back.hidden=true; main.querySelector('h2').focus(); return; } if(S.i<17){ S.i++; render(true); } });
back.addEventListener('click',()=>{ if(S.i>0){ S.i--; render(true); } });
render(false);
})();
</script>
